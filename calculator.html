<html>
	<head>
	 <meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="calculator.css">
	<script src="calculator.js" defer></script>
</head>
<body bgcolor=white>
	<div id="body"></div>
	<div id="display"></div>

	<div class="placeholder">
		<div id="btn-enter">=</div>
		<div id="btn-0">0</div>
		<div id="btn-1">1</div>
		<div id="btn-2">2</div>
		<div id="btn-3">3</div>
		<div id="btn-4">4</div>
		<div id="btn-5">5</div>
		<div id="btn-6">6</div>
		<div id="btn-7">7</div>
		<div id="btn-8">8</div>
		<div id="btn-9">9</div>
		<div id="btn-decimal">.</div>
		<div id="btn-negative">(-)</div>
		<div id="btn-plus">+</div>
		<div id="btn-minus">-</div>
		<div id="btn-multiply">X</div>
		<div id="btn-divide">/</div>
		<div id="btn-square">x²</div>
		<div id="btn-pi">π</div>
		<div id="btn-clear">C</div>
	</div>

	<div id="themes">
		<div class="theme-btn" data-theme="">Dark</div>
		<div class="theme-btn" data-theme="theme-light">Light</div>
		<div class="theme-btn" data-theme="theme-retro">Retro</div>
		<div class="theme-btn" data-theme="theme-highContrast">Neon</div>
	</div>

</body>
</html>
